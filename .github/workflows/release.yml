# Builds Driftline on GitHub's Macs and publishes it as a release.
# Trigger: push a tag like v1.0.0  →  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        env:
          RELAY_URL: https://driftline-relay.vinayakapavin.workers.dev
        run: VERSION="${GITHUB_REF_NAME#v}" bash build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Driftline ${{ github.ref_name }}
          files: build/Driftline.zip
          generate_release_notes: true
          body: |
            **Driftline by Apavin**: your internet speed, live in the Mac menu bar.

            ### Install
            1. Download **Driftline.zip** below and double-click it.
            2. Drag **Driftline** into your **Applications** folder and open it.
            3. If macOS says it can't verify the developer, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
               (Or run `xattr -cr /Applications/Driftline.app` in Terminal.)

            Requires macOS 13 Ventura or later. Works on Apple silicon and Intel Macs.
